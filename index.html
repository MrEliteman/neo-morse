<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Neo Morse</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #111111;
    --muted: #777777;
    --border: #dddddd;
    --button: #111111;
    --buttonText: #ffffff;
}

body.dark {
    --bg: #101010;
    --card: #1b1b1b;
    --text: #f5f5f5;
    --muted: #999999;
    --border: #353535;
    --button: #f5f5f5;
    --buttonText: #111111;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    transition: 0.2s;
}

.app {
    width: min(94%, 760px);
    margin: auto;
    padding: 25px 0 45px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 30px;
    font-weight: 700;
}

.subtitle {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

.theme {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
}

.card {
    margin-bottom: 12px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
}

.label {
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.8px;
}

select,
textarea,
button {
    font: inherit;
}

select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--card);
    color: var(--text);
}

textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 18px;
    line-height: 1.5;
}

textarea::placeholder {
    color: var(--muted);
}

.mode {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

button {
    min-height: 44px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button.active,
button.primary {
    border-color: var(--button);
    background: var(--button);
    color: var(--buttonText);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.result {
    min-height: 130px;
    padding: 5px 0;
    color: var(--text);
    font-size: 20px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.result.empty {
    color: var(--muted);
    font-size: 16px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
}

.secondary-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
}

.status {
    min-height: 20px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
}

.status.error {
    color: #d32f2f;
}

.status.success {
    color: #2e7d32;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
}

.setting {
    margin-top: 18px;
}

.setting:first-child {
    margin-top: 0;
}

.setting-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
}

.setting-value {
    color: var(--muted);
}

input[type="range"] {
    width: 100%;
    accent-color: var(--button);
}

.guide {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px 20px;
    max-height: 220px;
    overflow-y: auto;
}

.guide-item {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

.guide-code {
    font-family: monospace;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
}

@media (max-width: 520px) {
    .app {
        width: 94%;
        padding-top: 18px;
    }

    .mode,
    .controls,
    .secondary-controls {
        grid-template-columns: 1fr;
    }

    .guide {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <div class="logo">Neo Morse</div>
            <div class="subtitle">
                Простой переводчик азбуки Морзе

        </div>

        <button

    </header>


    <section class="card">

            <option value="ru">🇷🇺 Русский</option>

            <option value="de">🇩🇪 Немецкий</option>
            <option value="fr">🇫🇷 Французский</option>
            <option value="es">🇪🇸 Испанский</option>
            <option value="it">🇮🇹 Итальянский</option>
            <option value="pt">🇵🇹 Португальский</option>
            <option value="tr">🇹🇷 Турецкий</option>
            <option value="uk">🇺🇦 Украинский</option>
        </select>

    </section>


    <section class="card">

        <div class="label">
            РЕЖИМ
        </div>

        <div class="mode">

            <button
                id="encodeMode"
                class="active"
                type="button">
                Текст → Морзе
            </button>

            <button
                id="decodeMode"
                type="button">
                Морзе → текст
            </button>

        </div>

    </section>


    <section class="card">

        <div
            id="inputLabel"
            class="label">
            ТЕКСТ
        </div>

        <textarea
            id="input"
            placeholder="Напишите сообщение..."
            spellcheck="false"></textarea>

        <div class="row">
            <span>
                Символов:
                <span id="counter">0</span>
            </span>

            <button
                id="clearInput"
                type="button">
                Очистить
            </button>
        </div>

    </section>


    <section class="card">

        <div
            id="resultLabel"
            class="label">
            АЗБУКА МОРЗЕ
        </div>

        <div
            id="result"
            class="result empty">
            Здесь появится результат
        </div>

        <div class="controls">

            <button
                id="play"
                class="primary"
                type="button">
                ▶ Воспроизвести
            </button>

            <button
                id="stop"
                type="button"
                disabled>
                ■ Стоп
            </button>

        </div>

        <div class="secondary-controls">

            <button
                id="copy"
                type="button">
                Копировать
            </button>

            <button
                id="clearAll"
                type="button">
                Сбросить
            </button>

        </div>

        <div
            id="status"
            class="status">
        </div>

    </section>


    <section class="card">

        <div class="label">
            НАСТРОЙКИ ЗВУКА
        </div>

        <div class="setting">

            <div class="setting-title">
                <span>Скорость</span>

                <span
                    id="speedValue"
                    class="setting-value">
                    15 WPM
                </span>
            </div>

            <input
                id="speed"
                type="range"
                min="5"
                max="35"
                value="15">

        </div>


        <div class="setting">

            <div class="setting-title">
                <span>Частота</span>

                <span
                    id="frequencyValue"
                    class="setting-value">
                    700 Hz
                </span>
            </div>

            <input
                id="frequency"
                type="range"
                min="300"
                max="1200"
                value="700">

        </div>

    </section>


    <section class="card">

        <div class="label">
            ТАБЛИЦА МОРЗЕ
        </div>

        <div
            id="guide"
            class="guide">
        </div>

    </section>


    <div class="footer">
        Neo Morse
    </div>

</div>

/* =========================================
   ЭЛЕМЕНТЫ
========================================= */

const language = document.getElementById("language");
const input = document.getElementById("input");
const result = document.getElementById("result");
const counter = document.getElementById("counter");

const encodeMode = document.getElementById("encodeMode");
const decodeMode = document.getElementById("decodeMode");

const inputLabel = document.getElementById("inputLabel");
const resultLabel = document.getElementById("resultLabel");

const playButton = document.getElementById("play");
const stopButton = document.getElementById("stop");

const clearInputButton = document.getElementById("clearInput");
const clearAllButton = document.getElementById("clearAll");

const themeButton = document.getElementById("themeButton");

const speed = document.getElementById("speed");

const speedValue = document.getElementById("speedValue");
const frequencyValue = document.getElementById("frequencyValue");

const status = document.getElementById("status");
const guide = document.getElementById("guide");


/* =========================================
   СОСТОЯНИЕ
========================================= */

let currentMode = "encode";

let audioContext = null;
let oscillator = null;
let gain = null;

let playbackId = 0;


/* =========================================
   ОБРАТНЫЕ ТАБЛИЦЫ
========================================= */

const REVERSE = {};

for (const languageName in MORSE) {

    REVERSE[languageName] = {};

    const table = MORSE[languageName];

    for (const character in table) {

        const code = table[character];

        if (!REVERSE[languageName][code]) {
            REVERSE[languageName][code] = character;
        }
    }
}


/* =========================================
   СООБЩЕНИЯ
========================================= */

function showStatus(text, type) {

    status.textContent = text;

    status.className = "status";

    if (type) {
        status.classList.add(type);
    }
}


/* =========================================
   ПОЛУЧИТЬ АЛФАВИТ
========================================= */

function getAlphabet() {
    return MORSE[language.value];
}


/* =========================================
   ТЕКСТ → МОРЗЕ
========================================= */

function textToMorse(text) {

    const alphabet = getAlphabet();

    const characters = text.toUpperCase();

    const output = [];

    for (const character of characters) {

        if (character === " ") {
            output.push("/");
            continue;
        }

        if (alphabet[character]) {
            output.push(alphabet[character]);
        }
    }

    return output.join(" ");
}


/* =========================================
   МОРЗЕ → ТЕКСТ
========================================= */

function morseToText(text) {

    const table = REVERSE[language.value];

    const words = text.trim().split("/");

    const decodedWords = [];

    for (const word of words) {

        const letters = word.trim().split(/\s+/);

        let decoded = "";

        for (const code of letters) {

            if (table[code]) {
                decoded += table[code];
            } else {
                decoded += "?";
            }
        }

        decodedWords.push(decoded);
    }

    return decodedWords.join(" ");
}


/* =========================================
   ПЕРЕВОД
========================================= */

function translate() {

    counter.textContent = input.value.length;

    if (!input.value.trim()) {

        result.textContent =
            "Здесь появится результат";

        result.classList.add("empty");

        showStatus("");

        return;
    }

    let translated;

    if (currentMode === "encode") {
        translated = textToMorse(input.value);
    } else {
        translated = morseToText(input.value);
    }

    result.textContent =
        translated || "Нет результата";

    result.classList.remove("empty");

    showStatus("Готово", "success");
}


/* =========================================
   РЕЖИМ
========================================= */

function setMode(mode) {

    currentMode = mode;

    encodeMode.classList.toggle(
        "active",
        mode === "encode"
    );

    decodeMode.classList.toggle(
        "active",
        mode === "decode"
    );

    if (mode === "encode") {

        inputLabel.textContent = "ТЕКСТ";
        resultLabel.textContent = "АЗБУКА МОРЗЕ";

        input.placeholder =
            "Напишите сообщение...";

    } else {

        inputLabel.textContent =
            "АЗБУКА МОРЗЕ";

        resultLabel.textContent =
            "ТЕКСТ";

        input.placeholder =
            "Например: .... . .-.. .-.. ---";
    }

    translate();
}


/* =========================================
   ТАЙМИНГ
========================================= */

function getTiming() {

    const wpm = Number(speed.value);

    const dot = 1200 / wpm;

    return {
        dot: dot,
        dash: dot * 3,
        symbolGap: dot,
        letterGap: dot * 3,
        wordGap: dot * 7
    };
}
