<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neo Morse</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --text: #171717;
    --muted: #777777;
    --border: #dddddd;
    --accent: #171717;
    --accent-text: #ffffff;
}

body.dark {
    --bg: #111111;
    --card: #1b1b1b;
    --text: #f5f5f5;
    --muted: #999999;
    --border: #333333;
    --accent: #ffffff;
    --accent-text: #111111;
}

body {
    margin: 0;
    min-height: 100vh;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    transition: background 0.2s, color 0.2s;
}

.app {
    width: 92%;
    max-width: 720px;

    margin: auto;
    padding: 28px 0 40px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
}

.logo {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 4px;

    color: var(--muted);

    font-size: 14px;
}

.icon-button {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    border: 1px solid var(--border);

    background: var(--card);
    color: var(--text);

    font-size: 18px;

    cursor: pointer;
}

/* CARDS */

.card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 13px;
}

.label {
    color: var(--muted);

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 0.6px;

    margin-bottom: 10px;
}

/* SELECT */

select {
    width: 100%;

    padding: 13px 14px;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: var(--card);
    color: var(--text);

    font-size: 16px;

    outline: none;
}

/* MODE */

.mode {
    display: flex;
    gap: 8px;
}

.mode button {
    flex: 1;
}

/* TEXTAREA */

textarea {
    width: 100%;

    min-height: 145px;

    resize: vertical;

    border: 0;
    outline: none;

    background: transparent;
    color: var(--text);

    font-family: inherit;

    font-size: 18px;
    line-height: 1.5;
}

textarea::placeholder {
    color: var(--muted);
}

/* OUTPUT */

.output {
    min-height: 120px;

    font-size: 20px;

    line-height: 1.7;

    word-break: break-word;
}

/* BUTTONS */

.controls {
    display: flex;
    flex-wrap: wrap;

    gap: 9px;

    margin-top: 14px;
}

button {
    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 12px 15px;

    background: var(--card);
    color: var(--text);

    font-size: 15px;

    cursor: pointer;

    transition: transform 0.1s, opacity 0.1s;
}

button:active {
    transform: scale(0.96);
}

.primary {
    background: var(--accent);
    color: var(--accent-text);

    border: 0;
}

.danger {
    background: #b3261e;
    color: white;

    border: 0;
}

.active {
    background: var(--accent);
    color: var(--accent-text);

    border-color: var(--accent);
}

/* TOOLS */

.tools {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;
}

/* SETTINGS */

.settings {
    display: grid;

    gap: 17px;
}

.setting {
    display: grid;

    gap: 8px;
}

.setting-row {
    display: flex;

    justify-content: space-between;
    align-items: center;
}

.value {
    color: var(--muted);

    font-size: 13px;
}

input[type="range"] {
    width: 100%;
}

/* STATUS */

.status {
    margin-top: 8px;

    color: var(--muted);

    font-size: 12px;
}

/* FOOTER */

.footer {
    text-align: center;

    color: var(--muted);

    font-size: 12px;

    margin-top: 24px;
}

/* MOBILE */

@media (max-width: 500px) {

    .app {
        width: 94%;

        padding-top: 20px;
    }

    .logo {
        font-size: 27px;
    }

    .tools {
        grid-template-columns: 1fr;
    }

    button {
        padding: 12px;
    }

}

</style>
</head>

    </div>

        <div class="status">

    </div>


    <!-- OUTPUT -->

        </div>

        <div class="controls">

            </button>

            <button

                ■ Стоп

            </button>

        </div>

    </div>


    <!-- TOOLS -->

    <div class="card">

        <div class="label">
            ИНСТРУМЕНТЫ
        </div>

        <div class="tools">

            <button onclick="copyResult()">

            </button>

            <button onclick="clearAll()">
                Очистить
            </button>

            <button onclick="vibrateMorse()">
                ▪ Вибрация
            </button>

            <button onclick="playFlashlight()">
                ◉ Фонарик
            </button>

        </div>

    </div>


    <!-- SETTINGS -->

    <div class="card">

        <div class="label">
            НАСТРОЙКИ СИГНАЛА
        </div>

        <div class="settings">


            <div class="setting">

                <div class="setting-row">

                        Скорость
                    </span>

                    <span

                        id="speedValue">

                    </span>

                </div>

                <input
                    id="speed"
                    type="range"
                    min="5"
                    max="30"
                    value="15"
                    oninput="updateSettings()">

            </div>


            <div class="setting">

                <div class="setting-row">

                    <span>
                        Частота
                    </span>

                    <span
                        class="value"
                        id="frequencyValue">

                    </span>

                </div>

                <input
                    id="frequency"
                    type="range"
                    min="300"
                    max="1200"
                    value="700"
                    oninput="updateSettings()">

            </div>


        </div>

    </div>


    <div class="footer">

        Neo Morse · работает локально

    </div>

</div>

        reverseAlphabets[language][code] =

    }

}

    currentMode = mode;

    document
        .getElementById("textMode")
        .classList
        .toggle(
            "active",
            mode === "text"

    document
        .getElementById("morseMode")

            mode === "morse"
        );

        document
            .getElementById("outputLabel")

            .getElementById("input")
            .placeholder =

    }


    translateText();

}
