<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111111"
>

<title>Neo Morse</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #151515;
    --secondary: #737373;
    --border: #dddddd;
    --accent: #111111;
    --accent-text: #ffffff;
    --danger: #c62828;
}

body.dark {
    --bg: #101010;
    --card: #1a1a1a;
    --text: #f5f5f5;
    --secondary: #a0a0a0;
    --border: #333333;
    --accent: #f5f5f5;
    --accent-text: #111111;
    --danger: #ef5350;
}

html {
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100vh;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

button,
select,
textarea,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.app {
    width: min(94%, 760px);

    margin: 0 auto;

    padding:
        25px
        0
        45px;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
}

.logo {
    font-size: 30px;
    font-weight: 750;

    letter-spacing: -1px;
}

.subtitle {
    margin-top: 4px;

    color: var(--secondary);

    font-size: 13px;
}

.theme-button {
    width: 44px;
    height: 44px;

    padding: 0;

    border: 1px solid var(--border);
    border-radius: 50%;

    background: var(--card);
    color: var(--text);

    cursor: pointer;
}

/* =========================
   CARD
========================= */

.card {
    margin-bottom: 13px;

    padding: 18px;

    background: var(--card);

    border:
        1px solid
        var(--border);

    border-radius: 18px;
}

.label {
    margin-bottom: 9px;

    color: var(--secondary);

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 0.8px;
}

/* =========================
   SELECT
========================= */

select {
    width: 100%;

    padding:
        12px
        13px;

    border:
        1px solid
        var(--border);

    border-radius: 12px;

    outline: none;

    background: var(--card);
    color: var(--text);

    cursor: pointer;
}

/* =========================
   MODE
========================= */

.mode {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 8px;
}

.mode button {
    min-height: 46px;
}

/* =========================
   TEXTAREA
========================= */

textarea {
    display: block;

    width: 100%;

    min-height: 150px;

    padding: 0;

    resize: vertical;

    border: 0;
    outline: 0;

    background: transparent;
    color: var(--text);

    font-size: 18px;

    line-height: 1.55;
}

textarea::placeholder {
    color: var(--secondary);
}

/* =========================
   OUTPUT
========================= */

.output {
    min-height: 130px;

    padding: 4px 0;

    color: var(--text);

    font-size: 21px;

    line-height: 1.7;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}

.output.empty {
    color: var(--secondary);

    font-size: 16px;
}

/* =========================
   COUNTER
========================= */

.status-row {
    display: flex;

    justify-content: space-between;

    margin-top: 8px;

    color: var(--secondary);

    font-size: 12px;
}

/* =========================
   BUTTONS
========================= */

button {
    min-height: 44px;

    padding:
        10px
        14px;

    border:
        1px solid
        var(--border);

    border-radius: 12px;

    background: var(--card);
    color: var(--text);

    cursor: pointer;

    transition:
        transform 0.08s ease,
        opacity 0.15s ease,
        background 0.15s ease;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.45;

    cursor: not-allowed;
}

.primary {
    border-color: var(--accent);

    background: var(--accent);
    color: var(--accent-text);
}

.danger {
    border-color: var(--danger);

    background: var(--danger);
    color: white;
}

.active {
    border-color: var(--accent);

    background: var(--accent);
    color: var(--accent-text);
}

.main-controls {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 9px;

    margin-top: 14px;
}

.tools {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 9px;
}

/* =========================
   SETTINGS
========================= */

.setting {
    margin-top: 17px;
}

.setting:first-child {
    margin-top: 0;
}

.setting-top {
    display: flex;

    justify-content: space-between;

    margin-bottom: 8px;

    font-size: 14px;
}

.setting-value {
    color: var(--secondary);
}

input[type="range"] {
    display: block;

    width: 100%;

    accent-color: var(--accent);
}

/* =========================
   STATUS MESSAGE
========================= */

.message {
    min-height: 18px;

    margin-top: 12px;

    color: var(--secondary);

    font-size: 13px;
}

.message.success {
    color: #2e7d32;
}

.message.error {
    color: var(--danger);
}

/* =========================
   MORSE GUIDE
========================= */

.guide {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 6px 20px;

    max-height: 180px;

    overflow-y: auto;

    color: var(--secondary);

    font-size: 13px;
}

.guide-item {
    display: flex;

    justify-content: space-between;

    padding:
        5px
        0;

    border-bottom:
        1px solid
        var(--border);
}

.guide-code {
    color: var(--text);

    font-family:
        "Courier New",
        monospace;
}

/* =========================
   FOOTER
========================= */

.footer {
    padding-top: 12px;

    text-align: center;

    color: var(--secondary);

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    .app {
        width: 94%;

        padding-top: 18px;
    }

    .logo {
        font-size: 27px;
    }

    .main-controls,
    .tools {
        grid-template-columns: 1fr;
    }

    .guide {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

    <!-- MODE -->

    </section>


    <!-- INPUT -->

    <section class="card">

        </div>

        <textarea

        <div class="status-row">

            <span>

            </span>

            <button
                id="clearInputButton"

                Очистить

            </button>

        </div>

    </section>


    <!-- OUTPUT -->

    <section class="card">

        <div
            id="outputLabel"
            class="label">

            РЕЗУЛЬТАТ

        </div>

        <div
            id="output"
            class="output empty">

            Здесь появится результат

        </div>


        <div class="main-controls">

            <button
                id="playButton"
                class="primary"
                type="button">

                ▶ Воспроизвести

            </button>

            <button
                id="stopButton"
                class="danger"
                type="button">

                ■ Стоп

            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>

    </section>


    <!-- TOOLS -->

    <section class="card">

        <div class="label">
            ПЕРЕДАЧА И ИНСТРУМЕНТЫ
        </div>

        <div class="tools">

            <button
                id="copyButton"
                type="button">

                Копировать

            </button>

            <button
                id="vibrateButton"
                type="button">

                Вибрация

            </button>

            <button
                id="flashButton"
                type="button">

                Фонарик

            </button>

            <button
                id="clearButton"
                type="button">

                Сбросить всё

            </button>

        </div>

    </section>


    <!-- SETTINGS -->

    <section class="card">

        <div class="label">
            НАСТРОЙКИ СИГНАЛА
        </div>


        <div class="setting">

            <div class="setting-top">

                <span>
                    Скорость
                </span>

                <span
                    id="speedValue"
                    class="setting-value">

                    15 WPM

                </span>

            </div>

            <input
                id="speed"
                type="range"
                min="5"
                max="35"
                value="15">

        </div>


        <div class="setting">

            <div class="setting-top">

                <span>
                    Частота
                </span>

                <span
                    id="frequencyValue"
                    class="setting-value">

                    700 Hz

                </span>

            </div>

            <input
                id="frequency"
                type="range"
                min="300"
                max="1200"
                value="700">

        </div>

    </section>


    <!-- GUIDE -->

    <section class="card">

        <div class="label">
            ТАБЛИЦА МОРЗЕ
        </div>

        <div
            id="guide"
            class="guide">
        </div>

    </section>


    <footer class="footer">

        Neo Morse · работает локально

    </footer>

</div>
